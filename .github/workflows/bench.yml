name: Bench

# hivepack-zstd's speed against libzstd on the runners' processors, x86-64
# and arm64 Linux, which the speeds in docs/porting.md (an Apple M1 Pro)
# do not cover: `zstd-bench` on the Silesia corpus, the safe build and the
# `unsafe-fast` one. Run by hand, or by pushing a branch under bench/; the
# tables go to the job's summary and its log. Shared runners are noisy:
# the rounds take turns between libzstd and the port, so both meet the same
# noise, and the ratios hold better than the speeds.
on:
  workflow_dispatch:
    inputs:
      levels:
        description: Compression levels
        default: "1,3,5,7,9,12,15,16,19"
  push:
    branches: ['bench/**']

permissions:
  contents: read

jobs:
  zstd:
    name: zstd-bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      LEVELS: ${{ inputs.levels || '1,19' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Fetch the Silesia corpus
        run: python scripts/testdata.py fetch --group bench
      - name: Build both
        run: |
          cargo build --release --locked -p zstd-bench --features zstd/no_asm
          cp target/release/zstd-bench zstd-bench-safe
          cargo build --release --locked -p zstd-bench --features zstd/no_asm,hivepack-zstd/unsafe-fast
          cp target/release/zstd-bench zstd-bench-fast
      - name: The processor
        run: |
          {
            echo "## $(uname -m), $(grep -m1 -E 'model name|^CPU part' /proc/cpuinfo | cut -d: -f2 | xargs), $(nproc) threads"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          lscpu | head -20
      - name: The safe build
        run: |
          { echo "### Safe"; echo; ./zstd-bench-safe --levels "$LEVELS" --rounds 3 --seconds 0.5 target/testdata/silesia; echo; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: With unsafe-fast
        run: |
          { echo "### unsafe-fast"; echo; ./zstd-bench-fast --levels "$LEVELS" --rounds 3 --seconds 0.5 target/testdata/silesia; echo; } \
            | tee -a "$GITHUB_STEP_SUMMARY"
