name: Bench

# Each port's speed against what it comes from, on Linux x86-64, Windows x86-64 and
# macOS arm64: the tools in tools/*-bench, as scripts/bench_plan.py lists them. Run by
# hand. The tables go to the job's summary, its log and an artifact. Shared runners
# are noisy: the rounds take turns between the two sides, so both meet the same
# noise, and the ratios hold better than the speeds.
on:
  workflow_dispatch:
    inputs:
      formats:
        description: "Comma-separated, or all: tar, age, deflate, bzip2, lz4, xz, zstd, zip, 7z"
        default: all
      machines:
        description: "Comma-separated, or all: ubuntu-latest, windows-latest, macos-latest"
        default: all
      features:
        description: "cargo features for the tool, such as hivepack-zstd/unsafe-fast"
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        env:
          FORMATS: ${{ inputs.formats }}
          MACHINES: ${{ inputs.machines }}
        run: echo "matrix=$(python3 scripts/bench_plan.py "$FORMATS" "$MACHINES")" >> "$GITHUB_OUTPUT"

  bench:
    name: ${{ matrix.format }} (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FEATURES: ${{ inputs.features }}
      RUNS: ${{ matrix.runs }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: matrix.go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/tar-bench/go/go.mod
          cache: false
      - name: Fetch
        run: python scripts/testdata.py fetch ${{ matrix.sets }}
      - name: Build
        run: cargo build --release --locked -p ${{ matrix.package }} ${FEATURES:+--features "$FEATURES"}
      - name: The machine
        run: |
          {
            echo "## ${{ matrix.format }}, ${{ matrix.os }}"
            echo
            python - <<'PY'
          import os, platform, subprocess
          def out(*command):
              try:
                  return subprocess.run(command, capture_output=True, text=True).stdout.strip()
              except OSError:
                  return ""
          cpu = platform.processor()
          if platform.system() == "Linux":
              cpu = next((l.split(":")[1].strip() for l in open("/proc/cpuinfo") if l.startswith("model name")), cpu)
          if platform.system() == "Darwin":
              cpu = out("sysctl", "-n", "machdep.cpu.brand_string")
          print(f"{platform.platform()}, {platform.machine()}, {cpu}, {os.cpu_count()} threads")
          print()
          print(out("rustc", "-V"), "|", out("go", "version"), "|", out("cc", "--version").split("\n")[0])
          PY
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY" | tee bench.md
      - name: Run
        run: |
          python -c "import json, os; print('\n'.join(json.loads(os.environ['RUNS'])))" > runs.txt
          while IFS= read -r args; do
            args=${args%$'\r'}
            { echo "### ${{ matrix.package }} $args"; echo; ./target/release/${{ matrix.package }} $args; echo; } \
              | tee -a "$GITHUB_STEP_SUMMARY" | tee -a bench.md
          done < runs.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.format }}-${{ matrix.os }}
          path: bench.md
