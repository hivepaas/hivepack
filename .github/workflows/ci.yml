name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Miri and cargo-fuzz need nightly: this one, raised with
  # rust-toolchain.toml (README, "Rust versions").
  NIGHTLY: nightly-2026-10-27

jobs:
  checks:
    name: Format, lints and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The version and its components: rust-toolchain.toml.
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features hivepack-zstd/unsafe-fast,hivepack-lz4/unsafe-fast -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --workspace --no-deps --locked --features hivepack-zstd/unsafe-fast,hivepack-lz4/unsafe-fast
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 -m py_compile scripts/testdata.py

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The oldest Rust the libraries promise, rust-version in Cargo.toml,
      # in place of rust-toolchain.toml's.
      - name: Rust (rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$v" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"
      - run: cargo check -p hivepack-7z --lib --locked
      - run: cargo check -p hivepack-age --lib --locked
      - run: cargo check -p hivepack-bzip2 --lib --locked
      - run: cargo check -p hivepack-xz --lib --locked
      - run: cargo check -p hivepack-crypto --lib --locked
      - run: cargo check -p hivepack-deflate --lib --locked
      - run: cargo check -p hivepack-extract --lib --locked
      - run: cargo check -p hivepack-lz4 --lib --locked
      - run: cargo check -p hivepack-lz4 --lib --locked --features unsafe-fast
      - run: cargo check -p hivepack-open --lib --locked
      - run: cargo check -p hivepack-tar --lib --locked
      - run: cargo check -p hivepack-zip --lib --locked
      - run: cargo check -p hivepack-zstd --lib --locked
      - run: cargo check -p hivepack-zstd --lib --locked --features unsafe-fast

  licenses:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job also compares with zstd's fuzzing corpora. The Linux
          # jobs test the `unsafe-fast` feature too, on x86-64 and arm64.
          - os: ubuntu-latest
            groups: core,generated,fuzz
            cache: core-generated-fuzz
            unsafe-fast: true
          - os: ubuntu-24.04-arm
            groups: core,generated
            cache: core-generated
            unsafe-fast: true
          - os: macos-latest
            groups: core,generated
            cache: core-generated
          # Generating needs make, which the Windows runners do not have.
          - os: windows-latest
            groups: core
            cache: core
    env:
      HIVEPACK_TESTDATA_REQUIRED: ${{ matrix.groups }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The oracles written in Go, tools/age-oracle and tools/tar-oracle,
      # with the Go tar-oracle's go.mod names: the release whose archive/tar
      # hivepack-tar ports, new enough for age-oracle.
      - if: contains(matrix.groups, 'generated')
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/tar-oracle/go.mod
          cache-dependency-path: tools/age-oracle/go.sum
      - uses: actions/cache@v6
        with:
          path: target/testdata
          key: testdata-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cache }}-${{ hashFiles('testdata/manifest.json', 'scripts/testdata.py') }}
      - name: Fetch test data
        shell: bash
        run: |
          args=()
          for group in ${HIVEPACK_TESTDATA_REQUIRED//,/ }; do args+=(--group "$group"); done
          python scripts/testdata.py fetch "${args[@]}"
      - run: cargo test --workspace --locked
      - if: matrix.unsafe-fast
        run: cargo test -p hivepack-zstd --locked --features unsafe-fast
      - if: matrix.unsafe-fast
        run: cargo test -p hivepack-lz4 --locked --features unsafe-fast

  cross:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The encoder's tests are slow under emulation: s390x takes about half
    # an hour for the first run.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 32-bit, and big-endian: the format is little-endian and the port
        # must read it so on every machine.
        target: [i686-unknown-linux-gnu, s390x-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      # Only the committed sets: libzstd's speed under emulation does not
      # matter, the port's results do.
      - run: cross test --workspace --locked --target ${{ matrix.target }}
      # On 32-bit the feature changes nothing; on s390x it is a 64-bit,
      # big-endian machine with the unchecked copies. It changes only the
      # decoder, so only the decoder's tests run again with it.
      - run: >-
          cross test -p hivepack-zstd --locked --target ${{ matrix.target }} --features unsafe-fast
          --test decompress --test stream --test dctx --test testdata --test unchecked
      - run: >-
          cross test -p hivepack-zstd --locked --target ${{ matrix.target }} --features unsafe-fast
          --lib -- decompress:: oracle::
      # hivepack-lz4's feature changes only its block decoder, which every
      # test of the crate reaches.
      - run: cross test -p hivepack-lz4 --locked --target ${{ matrix.target }} --features unsafe-fast

  # The `unsafe-fast` feature's unsafe code under Miri, which fails on any
  # access out of bounds: the copies against the checked ones, and the
  # committed frames decoded with them, valid and damaged.
  miri:
    name: Miri (unsafe-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust (nightly)
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          echo "RUSTUP_TOOLCHAIN=$NIGHTLY" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test -p hivepack-zstd --locked --features unsafe-fast --lib unchecked
      - run: cargo miri test -p hivepack-zstd --locked --features unsafe-fast --test unchecked
        env:
          # The test reads the frames from the repository.
          MIRIFLAGS: -Zmiri-disable-isolation
      - run: cargo miri test -p hivepack-lz4 --locked --features unsafe-fast --lib unchecked
      - run: cargo miri test -p hivepack-lz4 --locked --features unsafe-fast --test unchecked
        env:
          # The test reads the recorded blocks from the repository.
          MIRIFLAGS: -Zmiri-disable-isolation

  # The decoder against libzstd on fuzzed input, with the `unsafe-fast`
  # feature, the compressor's frames and streaming calls against libzstd's,
  # inflate and deflate against zlib, bzip2 against libbzip2, lz4 against
  # liblz4, and the xz decoders and encoders against liblzma, under
  # AddressSanitizer. A few minutes per target; longer runs are done by hand
  # (see fuzz/README.md).
  fuzz:
    name: Fuzz (unsafe-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust (nightly)
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$NIGHTLY" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Seed the corpus with the committed frames
        run: |
          mkdir -p fuzz/corpus/decompress
          find testdata -name '*.zst' -exec cp {} fuzz/corpus/decompress/ \;
      # The prebuilt cargo-fuzz is a musl binary and would default to that
      # target, which the sanitizer does not support.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu --features unsafe-fast decompress -- -max_total_time=180
      - name: Seed the compressor's corpus with the committed files
        run: |
          mkdir -p fuzz/corpus/compress
          find testdata -type f -size -64k -exec cp {} fuzz/corpus/compress/ \;
      # Both sides take the strongest levels' tables, 640 MB each for an
      # input of unknown size, and the sanitizer keeps what is freed for a
      # while: more than libFuzzer's 2 GB.
      # With the `unsafe-fast` feature: the row match finder's other order,
      # with its prefetches. compress_stream fuzzes the safe one.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu --features unsafe-fast compress -- -max_total_time=120 -rss_limit_mb=4096
      - name: Seed the streaming compressor's corpus with the same files
        run: cp -r fuzz/corpus/compress fuzz/corpus/compress_stream
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu compress_stream -- -max_total_time=120 -rss_limit_mb=4096
      - name: Seed the sequence API's corpus with the same files
        run: cp -r fuzz/corpus/compress fuzz/corpus/sequences
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu sequences -- -max_total_time=60 -rss_limit_mb=4096
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu inflate -- -max_total_time=120
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu deflate -- -max_total_time=120
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu inflate9 -- -max_total_time=90
      - name: Seed the ZIP corpus with the recorded archives
        run: |
          mkdir -p fuzz/corpus/zip_open
          python3 - <<'PY'
          import pathlib
          lines = pathlib.Path("testdata/oracle/zip-open.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l and not l.startswith("#")):
              data = line.split("\t")[0].split(" ")[3]
              pathlib.Path(f"fuzz/corpus/zip_open/r{i}").write_bytes(b"" if data == "-" else bytes.fromhex(data))
          # Archives libzip encrypted, some with the password the target tries.
          lines = pathlib.Path("testdata/oracle/zip-decrypt.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l and not l.startswith("#")):
              data = line.split("\t")[0].split(" ")[-1]
              pathlib.Path(f"fuzz/corpus/zip_open/d{i}").write_bytes(b"" if data == "-" else bytes.fromhex(data))
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu zip_open -- -max_total_time=120
      - name: Seed the editing corpus with the same archives, behind a few edits
        run: |
          mkdir -p fuzz/corpus/zip_edit
          python3 - <<'PY'
          import pathlib
          for i, path in enumerate(sorted(pathlib.Path("fuzz/corpus/zip_open").glob("r*"))):
              # Two edits: delete entry i, rename entry 7i.
              edits = bytes([2, 0, i % 256, 1, 7 * i % 256])
              pathlib.Path(f"fuzz/corpus/zip_edit/r{i}").write_bytes(edits + path.read_bytes())
          for i, path in enumerate(sorted(pathlib.Path("fuzz/corpus/zip_open").glob("d*"))):
              # Two edits: encrypt entry i, set the default password.
              edits = bytes([2, 14 + 17 * (i % 4), i % 256, 15, 0])
              pathlib.Path(f"fuzz/corpus/zip_edit/d{i}").write_bytes(edits + path.read_bytes())
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu zip_edit -- -max_total_time=90
      - name: Seed the extraction corpus with the same archives, behind a choice of options
        run: |
          mkdir -p fuzz/corpus/extract
          python3 - <<'PY'
          import pathlib
          for i, path in enumerate(sorted(pathlib.Path("fuzz/corpus/zip_open").iterdir())):
              pathlib.Path(f"fuzz/corpus/extract/{path.name}").write_bytes(bytes([i % 256]) + path.read_bytes())
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu extract -- -max_total_time=60
      - name: Seed the bzip2 corpus
        run: |
          mkdir -p fuzz/corpus/bzip2
          python3 - <<'PY'
          import pathlib
          # The streams and inputs of the recorded requests, each after a
          # mode byte (even: decompress it, odd: compress it) and a seed.
          lines = pathlib.Path("testdata/oracle/bzip2.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l.startswith(("compress", "decompress"))):
              words = line.split("\t")[0].split(" ")
              data = b"" if words[-1] == "-" else bytes.fromhex(words[-1])
              mode = b"\x01" if words[0] == "compress" else b"\x00"
              pathlib.Path(f"fuzz/corpus/bzip2/r{i}").write_bytes(mode + bytes(8) + data)
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu bzip2 -- -max_total_time=90
      - name: Seed the age corpus with the recorded files
        run: |
          mkdir -p fuzz/corpus/age
          python3 - <<'PY'
          import pathlib
          # Files age encrypted, damaged or not, many to the identity and
          # passphrase the target tries.
          lines = pathlib.Path("testdata/oracle/age.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l.startswith("decrypt")):
              data = line.split("\t")[0].split(" ")[2]
              pathlib.Path(f"fuzz/corpus/age/r{i}").write_bytes(b"" if data == "-" else bytes.fromhex(data))
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu age -- -max_total_time=60
      - name: Seed the identity file corpus with the recorded ones
        run: |
          mkdir -p fuzz/corpus/age_keys
          python3 - <<'PY'
          import pathlib
          # SSH keys, files of keys and encrypted ones, damaged or not.
          lines = pathlib.Path("testdata/oracle/age.txt").read_text().splitlines()
          n = 0
          for line in (l for l in lines if l.startswith("decrypt")):
              for spec in line.split("\t")[0].split(" ")[1].split(","):
                  if spec.startswith("f:"):
                      data = spec.split(":")[1]
                      pathlib.Path(f"fuzz/corpus/age_keys/r{n}").write_bytes(b"" if data == "-" else bytes.fromhex(data))
                      n += 1
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu age_keys -- -max_total_time=30
      - name: Seed the lz4 corpus
        run: |
          mkdir -p fuzz/corpus/lz4
          python3 - <<'PY'
          import pathlib
          # The blocks and frames of the recorded requests, and the inputs
          # of the compressors', each after a mode byte (0 and 2: a block,
          # 1 and 3: a frame, 4 to 6: an input) and a seed.
          lines = pathlib.Path("testdata/oracle/lz4.txt").read_text().splitlines()
          modes = {"block": (0, 2), "frame": (1, 3), "compress": (4, 5, 6)}
          for i, line in enumerate(l for l in lines if l.split(" ")[0] in modes):
              words = line.split("\t")[0].split(" ")
              data = words[-1].split(",")[0]
              data = b"" if data == "-" else bytes.fromhex(data)
              for mode in modes[words[0]]:
                  pathlib.Path(f"fuzz/corpus/lz4/r{i}m{mode}").write_bytes(bytes([mode]) + bytes(8) + data)
          PY
      # With the `unsafe-fast` feature: the decoder's unchecked fast loop.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu --features unsafe-fast lz4 -- -max_total_time=60 -rss_limit_mb=4096
      - name: Seed the 7z corpus
        run: |
          mkdir -p fuzz/corpus/sevenz
          python3 - <<'PY'
          import pathlib
          # The archives of the recorded answers.
          lines = pathlib.Path("testdata/oracle/7z.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if not l.startswith("#")):
              pathlib.Path(f"fuzz/corpus/sevenz/r{i}").write_bytes(bytes.fromhex(line.split("\t")[0]))
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu sevenz -- -max_total_time=60 -rss_limit_mb=4096
      - name: Seed the tar corpus with Go's test archives
        run: |
          mkdir -p fuzz/corpus/tar
          cp testdata/go-tar/*.tar fuzz/corpus/tar/
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu tar -- -max_total_time=60
      - name: Seed the tar extraction corpus with the same archives, behind a choice of options
        run: |
          mkdir -p fuzz/corpus/extract_tar
          python3 - <<'PY'
          import pathlib
          for i, path in enumerate(sorted(pathlib.Path("testdata/go-tar").glob("*.tar"))):
              pathlib.Path(f"fuzz/corpus/extract_tar/{path.name}").write_bytes(bytes([i % 256]) + path.read_bytes())
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu extract_tar -- -max_total_time=60
      - name: Seed the layers corpus with the recorded age files and what they hold
        run: |
          mkdir -p fuzz/corpus/open
          python3 - <<'PY'
          import pathlib
          # Compressed tar archives and plain data, and age files of them,
          # most to the key the target tries, each after a byte that picks
          # no name.
          lines = pathlib.Path("testdata/oracle/open.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l.startswith("encrypt")):
              request, answer = line.split("\t")
              pathlib.Path(f"fuzz/corpus/open/p{i}").write_bytes(b"\0" + bytes.fromhex(request.split(" ")[3]))
              pathlib.Path(f"fuzz/corpus/open/a{i}").write_bytes(b"\0" + bytes.fromhex(answer.split(" ")[1]))
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu open -- -max_total_time=30
      - name: Seed the xz corpus
        run: |
          mkdir -p fuzz/corpus/xz
          python3 - <<'PY'
          import pathlib
          # The inputs of the recorded requests, each after a mode byte that
          # picks their decoder (raw LZMA1 for chains that end with the
          # filters 1 and 2, raw LZMA2 for 21) and a seed.
          modes = {"stream": 0, "auto": 1, "lzip": 2, "alone": 3}
          lines = pathlib.Path("testdata/oracle/xz.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l.startswith("decode ")):
              words = line.split("\t")[0].split(" ")
              kind = words[1].split(":")[0]
              last = words[1].split("+")[-1].removeprefix("raw:")
              mode = modes.get(kind, 4 if last.startswith(("1:", "2:")) else 5)
              data = b"" if words[-1] == "-" else bytes.fromhex(words[-1])
              pathlib.Path(f"fuzz/corpus/xz/r{i}").write_bytes(bytes([mode]) + i.to_bytes(8, "little") + data)
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu xz -- -max_total_time=90 -rss_limit_mb=4096
      - name: Seed the xz_encode corpus
        run: |
          mkdir -p fuzz/corpus/xz_encode
          python3 - <<'PY'
          import pathlib
          # The inputs of the recorded encodings, each after a mode byte
          # that picks their encoder and a seed.
          modes = {"easyenc": 0, "streamenc": 1, "aloneenc": 2}
          lines = pathlib.Path("testdata/oracle/xz-encode.txt").read_text().splitlines()
          for i, line in enumerate(l for l in lines if l.startswith("code ")):
              words = line.split("\t")[0].split(" ")
              kind = words[1].split(":")[0]
              last = words[1].split("+")[-1].removeprefix("rawenc:")
              mode = modes.get(kind, 4 if last.startswith("21:") else 3)
              data = b"" if words[-1] == "-" else bytes.fromhex(words[-1])
              pathlib.Path(f"fuzz/corpus/xz_encode/r{i}").write_bytes(bytes([mode]) + i.to_bytes(8, "little") + data)
          PY
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu xz_encode -- -max_total_time=90 -rss_limit_mb=4096
