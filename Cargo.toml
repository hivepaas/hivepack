[workspace]
resolver = "3"
members = ["crates/age", "crates/bzip2", "crates/crypto", "crates/deflate", "crates/extract", "crates/xz", "crates/zip", "crates/zstd", "tools/bzip2-bench", "tools/deflate-bench", "tools/xz-bench", "tools/ziptool", "tools/zstd-bench"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["HivePaaS"]
repository = "https://github.com/hivepaas/hivepack-rs"
homepage = "https://github.com/hivepaas/hivepack-rs"

[workspace.dependencies]
hivepack-age = { path = "crates/age" }
hivepack-bzip2 = { path = "crates/bzip2" }
hivepack-crypto = { path = "crates/crypto" }
hivepack-deflate = { path = "crates/deflate" }
hivepack-extract = { path = "crates/extract" }
hivepack-xz = { path = "crates/xz" }
hivepack-zip = { path = "crates/zip" }
hivepack-zstd = { path = "crates/zstd" }
# The official libraries, used only as the reference in tests and
# benchmarks. zstd 0.14.3 builds libzstd 1.5.7, the release hivepack-zstd
# ports. The legacy formats (v0.1 to v0.7) are left out, as the port does not
# read them. With its worker threads (`zstdmt`), for the frames compressed
# with `ZSTD_c_nbWorkers`.
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder", "experimental", "zstdmt"] }
# libz-sys 1.1.31 bundles zlib 1.3.2, the release hivepack-deflate ports, and
# its `static` feature builds that rather than linking the system's zlib,
# which may be another version. flate2, with its zlib backend, is the safe
# interface to it.
libz-sys = { version = "=1.1.31", features = ["static"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
# bzip2-sys 0.1.13 bundles libbzip2 1.0.8, the release hivepack-bzip2
# ports, and its `static` feature builds that rather than linking the
# system's libbz2, which distributions patch. The bzip2 crate is the safe
# interface to it, with its default backend, libbz2-rs-sys (a translation
# of the same C), left out.
bzip2 = { version = "0.6.1", default-features = false, features = ["bzip2-sys", "static"] }
# liblzma-sys 0.4.9 bundles liblzma 5.8.4, the release hivepack-xz ports,
# and its `static` feature builds that rather than linking the system's
# liblzma, which may be another version. The liblzma crate is the safe
# interface to it.
liblzma = { version = "0.4.9", features = ["static"] }
liblzma-sys = { version = "=0.4.9", features = ["static"] }
# Directories opened by handle, where nothing resolves outside them or
# through a symbolic link: hivepack-extract's way to write, until the
# standard library's directory handles (`std::fs::Dir`) are stable. The one
# dependency with `unsafe` code in a library; see docs/safety.md.
cap-std = { version = "4.0.3", default-features = false }
cap-fs-ext = { version = "4.0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The safety rules in docs/safety.md, enforced for every crate.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Tests compare against large inputs; an unoptimised libzstd or zlib makes
# them slow for no benefit.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.libz-sys]
opt-level = 3

[profile.dev.package.bzip2-sys]
opt-level = 3

[profile.dev.package.liblzma-sys]
opt-level = 3

# hivepack-zip's tests compress and decompress gigabytes (libzip's
# zip64_creation adds 4 GiB): optimized, as the C libraries are, though
# with the checks of a dev build.
[profile.dev.package.hivepack-deflate]
opt-level = 3

[profile.release]
debug = "line-tables-only"
