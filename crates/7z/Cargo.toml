[package]
name = "hivepack-7z"
version = "0.0.0"
description = "Reading 7z archives in safe Rust, ported from the 7z decoder of the LZMA SDK (7-Zip)"
license = "MIT"
readme = "README.md"
keywords = ["7z", "7-zip", "archive", "lzma"]
categories = ["compression", "encoding"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# CRC-32, which 7z checks its headers and files with.
hivepack-deflate.workspace = true
# LZMA, LZMA2, and the branch filters.
hivepack-xz.workspace = true
