[package]
name = "hivepack-7z"
version = "0.0.0"
description = "Reading 7z archives in safe Rust, ported from the 7z decoder of the LZMA SDK (7-Zip)"
license = "MIT"
readme = "README.md"
keywords = ["7z", "7-zip", "archive", "lzma"]
categories = ["compression", "encoding"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# BZip2.
hivepack-bzip2.workspace = true
# AES and SHA-256, for 7zAES.
hivepack-crypto.workspace = true
# CRC-32, which 7z checks its headers and files with, and Deflate and
# Deflate64.
hivepack-deflate.workspace = true
# LZMA and LZMA2.
hivepack-xz.workspace = true
# Zstandard.
hivepack-zstd.workspace = true
