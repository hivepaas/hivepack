[package]
name = "hivepack-age"
version = "0.0.0"
description = "Decrypting age files in safe Rust, ported from age, the reference implementation in Go"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["age", "encryption", "decryption", "x25519", "scrypt"]
categories = ["cryptography"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# SHA-256, HMAC, HKDF, ChaCha20-Poly1305, X25519 and scrypt, ported from
# BearSSL, in place of Go's standard library and golang.org/x/crypto.
hivepack-crypto.workspace = true

[dev-dependencies]
# The test vectors of C2SP's CCTV are zlib-compressed when large.
hivepack-deflate.workspace = true
