[package]
name = "hivepack-cpio"
version = "0.0.0"
description = "Reading cpio archives and RPM packages' payloads in safe Rust, ported from libarchive"
license = "BSD-2-Clause"
readme = "README.md"
keywords = ["cpio", "rpm", "initramfs", "archive"]
categories = ["compression", "encoding", "filesystem"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dev-dependencies]
# libarchive's RPM test packages hold their cpio archives compressed with
# gzip and bzip2, and one of its cpio archives is gzipped.
hivepack-deflate.workspace = true
hivepack-bzip2.workspace = true
