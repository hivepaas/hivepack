[package]
name = "hivepack-deflate"
version = "0.0.0"
description = "Deflate, zlib and gzip decompression in safe Rust, ported from the official library, zlib"
license = "Zlib"
readme = "README.md"
keywords = ["deflate", "zlib", "gzip", "inflate", "compression"]
categories = ["compression"]
# Nothing to publish until the decoder is checked against zlib.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dev-dependencies]
# zlib 1.3.2, the reference (see the workspace's Cargo.toml).
libz-sys.workspace = true
flate2.workspace = true
