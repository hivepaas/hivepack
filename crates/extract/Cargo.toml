[package]
name = "hivepack-extract"
version = "0.0.0"
description = "Extracting archives to disk, safe by default: nothing outside the destination, through links, or past limits"
license = "MIT AND Unicode-3.0"
readme = "README.md"
keywords = ["extract", "unzip", "archive", "zip-slip", "zip-bomb"]
categories = ["filesystem", "compression"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
hivepack-zip.workspace = true
hivepack-tar.workspace = true
hivepack-iso.workspace = true
hivepack-cpio.workspace = true
hivepack-xar.workspace = true
# The layers around a package's payloads (gzip, pbzx).
hivepack-open.workspace = true
hivepack-udf.workspace = true
hivepack-7z.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true

[dev-dependencies]
# libarchive's ISO 9660 test images are kept compressed with xz, and the
# tests compress zisofs files with zlib's deflate.
hivepack-xz.workspace = true
hivepack-deflate.workspace = true
# For the SHA-256 of the files of testdata/udf's images, which Linux's
# answers give.
hivepack-crypto.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rustix.workspace = true
