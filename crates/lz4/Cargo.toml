[package]
name = "hivepack-lz4"
version = "0.0.0"
description = "LZ4 compression and decompression in safe Rust, ported from the official library, liblz4"
license = "BSD-2-Clause"
readme = "README.md"
keywords = ["lz4", "compression", "decompression"]
categories = ["compression"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The decoder's fast loop reads and writes its pieces without bounds checks,
# as liblz4 does: faster, at the cost of some `unsafe` code, in
# `src/unchecked.rs` and the block that turns it on. Off by default:
# without it the crate has no unsafe code at all. See docs/unsafe.md.
unsafe-fast = []

# The workspace's lints, but `unsafe_code` is `deny` rather than `forbid`, so
# that the `unsafe-fast` feature's code can allow it. Without the
# feature, lib.rs forbids it again.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
# liblz4 1.10.0, the reference (see the workspace's Cargo.toml). lz4-sys
# is named only to pin the release it bundles.
lz4.workspace = true
lz4-sys.workspace = true
