[package]
name = "hivepack-open"
version = "0.0.0"
description = "Opening what hivepack reads: age, zstd, xz, lz4, gzip, bzip2, pbzx and RPM layers found and stacked, then the container told"
license = "MIT"
readme = "README.md"
keywords = ["archive", "decompression", "age", "tar", "zstd"]
categories = ["compression"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
hivepack-age.workspace = true
hivepack-bzip2.workspace = true
hivepack-cpio.workspace = true
hivepack-deflate.workspace = true
hivepack-lz4.workspace = true
hivepack-xz.workspace = true
hivepack-zstd.workspace = true

[dev-dependencies]
# The reference libraries, to compress what the tests open.
zstd.workspace = true
flate2.workspace = true
bzip2.workspace = true
liblzma.workspace = true
lz4.workspace = true
hivepack-tar.workspace = true
hivepack-extract.workspace = true
hivepack-iso.workspace = true
# For the UDF volumes it finds.
hivepack-udf.workspace = true
# For the payloads of the packages it finds.
hivepack-xar.workspace = true
# For the 7z archives it finds.
hivepack-7z.workspace = true
