[package]
name = "hivepack-rar"
version = "0.0.0"
description = "Reading RAR archives in safe Rust, ported from RARLAB's UnRAR; reads RAR, never writes it"
# UnRAR's own license: RAR archives may be read with it in any software,
# but it may not be used to write RAR or re-create its compression. See
# LICENSE and docs/rar.md.
license = "UnRAR"
readme = "README.md"
keywords = ["rar", "unrar", "archive", "decompression"]
categories = ["compression"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
hivepack-crypto.workspace = true
hivepack-deflate.workspace = true
