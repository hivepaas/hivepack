[package]
name = "hivepack-tar"
version = "0.0.0"
description = "Reading tar archives in safe Rust, ported from Go's archive/tar"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["tar", "archive", "pax", "ustar"]
categories = ["compression", "encoding"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dev-dependencies]
# SHA-256, to compare the data read with Go's.
hivepack-crypto.workspace = true
# Two of Go's test archives are bzip2-compressed.
hivepack-bzip2.workspace = true
