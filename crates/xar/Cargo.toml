[package]
name = "hivepack-xar"
version = "0.0.0"
description = "Reading XAR archives (macOS .pkg and .xip files) in safe Rust, ported from libarchive"
license = "BSD-2-Clause AND MIT"
readme = "README.md"
keywords = ["xar", "pkg", "xip", "macos", "archive"]
categories = ["compression", "encoding"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# zlib's inflate, for the table of contents and data compressed with gzip.
hivepack-deflate.workspace = true
# libbzip2's decompressor, for data compressed with bzip2.
hivepack-bzip2.workspace = true
# liblzma's .xz and .lzma decoders, for data compressed with xz or lzma.
hivepack-xz.workspace = true
# The checksums: MD5, SHA-1, SHA-256 and SHA-512.
hivepack-crypto.workspace = true

[dev-dependencies]
