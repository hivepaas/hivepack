[package]
name = "hivepack-zip"
version = "0.0.0"
description = "ZIP archives in safe Rust, the container logic ported from libzip"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["zip", "archive", "libzip"]
categories = ["compression", "encoding"]
# Nothing to publish yet.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# CRC-32 and deflate, ported from zlib.
hivepack-deflate.workspace = true
# bzip2, ported from libbzip2.
hivepack-bzip2.workspace = true
# AES, HMAC-SHA1 and PBKDF2 for WinZip AES, ported from BearSSL.
hivepack-crypto.workspace = true
