[package]
name = "hivepack-zstd"
version = "0.0.0"
description = "Zstandard (zstd) compression and decompression in safe Rust, ported from the official library"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["zstd", "zstandard", "compression", "decompression"]
categories = ["compression"]
# Nothing to publish until the decoder works.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# The sequence loop's copies without per-piece bounds checks: faster
# (about 0.95x libzstd instead of 0.92x on Apple M1), at the cost of some
# `unsafe` code, in `src/decompress/unchecked.rs` and the block that turns
# it on. And the row match finder's prefetches, in `src/common/prefetch.rs`.
# Off by default: without it the crate has no unsafe code at all.
# See docs/unsafe.md.
unsafe-fast = []

# The workspace's lints, but `unsafe_code` is `deny` rather than `forbid`, so
# that the `unsafe-fast` feature's code can allow it. Without the
# feature, lib.rs forbids it again.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
# Without libzstd's x86-64 assembly for Huffman decoding, as the oracle is
# built: the port follows the C loops, and on damaged input the assembly
# need not stop where they do.
zstd = { workspace = true, features = ["no_asm"] }
serde.workspace = true
serde_json.workspace = true
