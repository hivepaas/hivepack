[package]
name = "hivepack-zstd"
version = "0.0.0"
description = "Zstandard (zstd) compression and decompression in safe Rust, ported from the official library"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["zstd", "zstandard", "compression", "decompression"]
categories = ["compression"]
# Nothing to publish until the decoder works.
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Without libzstd's x86-64 assembly for Huffman decoding, as the oracle is
# built: the port follows the C loops, and on damaged input the assembly
# need not stop where they do.
zstd = { workspace = true, features = ["no_asm"] }
serde.workspace = true
serde_json.workspace = true
