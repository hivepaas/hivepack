[package]
name = "hivepack-fuzz"
version = "0.0.0"
description = "Fuzzers that compare hivepack-zstd with libzstd, hivepack-deflate with zlib, hivepack-bzip2 with libbzip2, and hivepack-xz with liblzma, and that feed hivepack-zip, hivepack-extract and hivepack-age any input"
publish = false
license = "MIT"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
# Fuzz the build with the sequence loop's unchecked copies.
unsafe-fast = ["hivepack-zstd/unsafe-fast"]

[dependencies]
libfuzzer-sys = "0.4"
hivepack-zstd = { path = "../crates/zstd" }
# libzstd 1.5.7, without the x86-64 Huffman assembly, with its worker threads,
# as the tests build it.
zstd = { version = "0.14.3", default-features = false, features = ["experimental", "no_asm", "zstdmt"] }
hivepack-deflate = { path = "../crates/deflate" }
hivepack-zip = { path = "../crates/zip" }
hivepack-extract = { path = "../crates/extract" }
# zlib 1.3.2, built from libz-sys's bundled sources, as the tests build it.
libz-sys = { version = "=1.1.31", features = ["static"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
hivepack-bzip2 = { path = "../crates/bzip2" }
hivepack-age = { path = "../crates/age" }
# libbzip2 1.0.8, built from bzip2-sys's bundled sources, as the tests build
# it.
bzip2 = { version = "0.6.1", default-features = false, features = ["bzip2-sys", "static"] }
hivepack-xz = { path = "../crates/xz" }
# liblzma 5.8.4, built from liblzma-sys's bundled sources, not the system's.
liblzma = { version = "0.4.9", features = ["static"] }
liblzma-sys = { version = "=0.4.9", features = ["static"] }

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress"
path = "fuzz_targets/compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress_stream"
path = "fuzz_targets/compress_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deflate"
path = "fuzz_targets/deflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate9"
path = "fuzz_targets/inflate9.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_open"
path = "fuzz_targets/zip_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_edit"
path = "fuzz_targets/zip_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bzip2"
path = "fuzz_targets/bzip2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "age"
path = "fuzz_targets/age.rs"
test = false
doc = false
bench = false

[[bin]]
name = "age_keys"
path = "fuzz_targets/age_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xz"
path = "fuzz_targets/xz.rs"
test = false
doc = false
bench = false

# Not in the main workspace: cargo-fuzz builds it with nightly and its own
# flags.
[workspace]
