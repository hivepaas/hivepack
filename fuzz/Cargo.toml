[package]
name = "hivepack-fuzz"
version = "0.0.0"
description = "Fuzzers that compare hivepack-zstd with libzstd, and hivepack-deflate with zlib"
publish = false
license = "MIT"
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
# Fuzz the build with the sequence loop's unchecked copies.
unsafe-fast = ["hivepack-zstd/unsafe-fast"]

[dependencies]
libfuzzer-sys = "0.4"
hivepack-zstd = { path = "../crates/zstd" }
# libzstd 1.5.7, without the x86-64 Huffman assembly, as the tests build it.
zstd = { version = "0.14.3", default-features = false, features = ["experimental", "no_asm"] }
hivepack-deflate = { path = "../crates/deflate" }
# zlib 1.3.2, built from libz-sys's bundled sources, as the tests build it.
libz-sys = { version = "=1.1.30", features = ["static"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress"
path = "fuzz_targets/compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress_stream"
path = "fuzz_targets/compress_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deflate"
path = "fuzz_targets/deflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate9"
path = "fuzz_targets/inflate9.rs"
test = false
doc = false
bench = false

# Not in the main workspace: cargo-fuzz builds it with nightly and its own
# flags.
[workspace]
